<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/images/helicopter.svg?v=1.8.2">
    <title>Login - Heli Logbook</title>
    <link rel="stylesheet" href="/css/styles.css?v=1.8.2">
    <script src="/js/appearance.js?v=1.8.2"></script>
    <link rel="stylesheet" href="/css/cockpit.css?v=1.8.2">
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <img class="login-mark" src="/images/helicopter.svg?v=1.8.2" alt="" width="80" height="64">
                <h1 class="login-title">Heli Logbook</h1>
                <p class="login-subtitle">Your helicopter flight record</p>
            </div>

            <!-- Error Alert -->
            <div id="errorAlert" class="alert alert-error hidden"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <input type="text" id="username" name="username" class="form-input" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <input type="password" id="password" name="password" class="form-input" required autocomplete="current-password">
                </div>

                <button type="submit" class="btn btn-primary btn-block" id="submitBtn">Login</button>
            </form>
        </div>
    </div>

    <script src="/js/login.js"></script>
</body>
</html>
